<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact AKHI</title>
  <link rel="icon" type="image/svg+xml" href="/akhi_favicon.svg">
  <style>
    :root {
      --rose: #E85D75;
      --gold: #D4AF37;
      --teal: #45A29E;
      --obsidian: #0A0A0F;
      --text-primary: #F2F2F0;
      --text-secondary: #aaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { scroll-behavior: smooth; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0A0A0F 0%, #1a0d2e 50%, #0A0A0F 100%);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(10,10,15,0.98);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(232,93,117,0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .nav-logo > img {
      width: 32px;
      height: 32px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--rose), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }

    .nav-back {
      font-size: 14px;
      color: var(--text-secondary);
      transition: all 0.3s;
      text-decoration: none;
    }

    .nav-back:hover {
      color: var(--rose);
    }

    .form-container {
      max-width: 560px;
      margin: 60px auto 40px;
      padding: 0 16px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeInDown 0.6s ease-out forwards;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-header h1 {
      font-size: 32px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--text-primary), var(--rose));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-header p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .form-box {
      border: 1.5px solid rgba(212,175,55,0.2);
      border-radius: 16px;
      padding: 32px;
      background: linear-gradient(135deg, rgba(42,27,78,0.3) 0%, rgba(26,26,36,0.5) 100%);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      opacity: 0;
      animation: fadeInUp 0.6s ease-out 0.1s forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(10,10,15,0.6);
      border: 1.5px solid rgba(232,93,117,0.2);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s;
      resize: vertical;
    }

    .form-group textarea {
      min-height: 140px;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(170,170,170,0.5);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--rose);
      box-shadow: 0 0 12px rgba(232,93,117,0.3);
      background: rgba(10,10,15,0.8);
    }

    .form-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--rose), #ff6b87);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(232,93,117,0.3);
    }

    .form-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(232,93,117,0.4);
    }

    .form-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .form-message.success {
      background: rgba(69,162,158,0.2);
      color: var(--teal);
      border: 1px solid var(--teal);
    }

    .form-message.error {
      background: rgba(232,93,117,0.2);
      color: var(--rose);
      border: 1px solid var(--rose);
    }

    @media (max-width: 480px) {
      .form-container {
        margin: 40px auto 20px;
        padding: 0 12px;
      }

      .form-header h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .form-header p {
        font-size: 13px;
      }

      .form-box {
        padding: 20px;
        border-radius: 12px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        font-size: 13px;
      }

      .form-group input,
      .form-group textarea {
        padding: 10px 12px;
        font-size: 13px;
      }

      .form-group textarea {
        min-height: 120px;
      }

      .form-submit {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">
    <img src="/akhi_logo_premium.svg" alt="AKHI Logo">
    <p class="logo-text">AKHI</p>
  </a>
  <a href="/" class="nav-back">← Back to Home</a>
</nav>

<div class="form-container">
  <div class="form-header">
    <h1>Get in <span style="color: var(--rose);">Touch</span></h1>
    <p>Have questions about AKHI? Want to discuss your AI security concerns? Let's talk.</p>
  </div>

  <div class="form-box">
    <form id="contactForm">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          placeholder="Your Name" 
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="your@email.com" 
          required
        >
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea 
          id="message" 
          name="message" 
          placeholder="Tell us about your AI security concerns..." 
          required
        ></textarea>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Send Message</button>
      <div id="formMessage"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
<script src="/api.js"></script>
<script>
  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const message = document.getElementById('message').value;
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('formMessage');
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    const result = await submitContactInquiry(name, email, message);

    if (result.success) {
      messageDiv.className = 'form-message success';
      messageDiv.textContent = result.message;
      document.getElementById('contactForm').reset();
      setTimeout(() => {
        messageDiv.textContent = '';
      }, 4000);
    } else {
      messageDiv.className = 'form-message error';
      messageDiv.textContent = result.message;
    }

    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Message';
  });
</script>

</body>
</html>
