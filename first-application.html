<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be AKHI's First Client</title>
  <link rel="icon" type="image/svg+xml" href="/akhi_favicon.svg">
  <style>
    :root {
      --rose: #E85D75;
      --gold: #D4AF37;
      --teal: #45A29E;
      --text-primary: #F2F2F0;
      --text-secondary: #aaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0A0A0F 0%, #1a0d2e 50%, #0A0A0F 100%);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(10,10,15,0.98);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(232,93,117,0.15);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .nav-logo > img { width: 32px; }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--rose), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }

    .nav-back {
      font-size: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.3s;
    }

    .nav-back:hover { color: var(--rose); }

    .container {
      max-width: 560px;
      margin: 60px auto 40px;
      padding: 0 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeInDown 0.6s ease-out forwards;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--text-primary), var(--rose));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      background: rgba(232,93,117,0.2);
      border: 1px solid var(--rose);
      color: var(--rose);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .form-box {
      border: 1.5px solid rgba(212,175,55,0.2);
      border-radius: 16px;
      padding: 32px;
      background: linear-gradient(135deg, rgba(42,27,78,0.3) 0%, rgba(26,26,36,0.5) 100%);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      opacity: 0;
      animation: fadeInUp 0.6s ease-out 0.1s forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(10,10,15,0.6);
      border: 1.5px solid rgba(232,93,117,0.2);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--rose);
      box-shadow: 0 0 12px rgba(232,93,117,0.3);
      background: rgba(10,10,15,0.8);
    }

    .form-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--rose), #ff6b87);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(232,93,117,0.3);
    }

    .form-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(232,93,117,0.4);
    }

    .form-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .message.success {
      background: rgba(69,162,158,0.2);
      color: var(--teal);
      border: 1px solid var(--teal);
    }

    .message.error {
      background: rgba(232,93,117,0.2);
      color: var(--rose);
      border: 1px solid var(--rose);
    }

    @media (max-width: 480px) {
      .container { margin: 40px auto 20px; padding: 0 12px; }
      .header h1 { font-size: 24px; margin-bottom: 8px; }
      .header p { font-size: 13px; }
      .form-box { padding: 20px; border-radius: 12px; }
      .form-group { margin-bottom: 16px; }
      .form-group label { font-size: 13px; }
      .form-group input { padding: 10px 12px; font-size: 13px; }
      .form-submit { padding: 12px; font-size: 14px; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">
    <img src="/akhi_logo_premium.svg" alt="AKHI Logo">
    <p class="logo-text">AKHI</p>
  </a>
  <a href="/" class="nav-back">← Back to Home</a>
</nav>

<div class="container">
  <div class="header">
    <span class="badge">⭐ FIRST CLIENT SPECIAL</span>
    <h1>Free Full <span style="color: var(--rose);">Assessment</span></h1>
    <p>Be AKHI's first official client. Get our complete $4,500 Full Assessment package at zero cost.</p>
  </div>

  <div class="form-box">
    <form id="firstClientForm">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Your Name" required>
      </div>

      <div class="form-group">
        <label for="email">Company Email</label>
        <input type="email" id="email" name="email" placeholder="your@company.com" required>
      </div>

      <div class="form-group">
        <label for="company">Company Name</label>
        <input type="text" id="company" name="company" placeholder="Your Company" required>
      </div>

      <div class="form-group">
        <label for="aiSystem">AI System to Test</label>
        <input type="text" id="aiSystem" name="aiSystem" placeholder="e.g., Custom LLM, ChatBot, etc." required>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">Apply Now</button>
      <div id="formMessage"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
<script src="/api.js"></script>
<script>
  document.getElementById('firstClientForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const company = document.getElementById('company').value;
    const aiSystem = document.getElementById('aiSystem').value;
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('formMessage');
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    const result = await submitFirstClientApplication(name, email, company, aiSystem);

    messageDiv.className = result.success ? 'message success' : 'message error';
    messageDiv.textContent = result.message;

    if (result.success) {
      document.getElementById('firstClientForm').reset();
      setTimeout(() => messageDiv.textContent = '', 4000);
    }

    submitBtn.disabled = false;
    submitBtn.textContent = 'Apply Now';
  });
</script>

</body>
</html>
